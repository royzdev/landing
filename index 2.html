<style>
:root{--bg:#000;--ink:#fff;--mut:#9b9ba3;--dim:#5a5a62;--line:rgba(255,255,255,.12);--lw:rgba(255,255,255,.7);--card:#050505;--ease:cubic-bezier(.2,.8,.2,1);
--head:"Unbounded","Onest",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font:400 16px/1.6 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
::selection{background:#fff;color:#000}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
#sand{position:absolute;top:0;left:0;width:100%;height:760px;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
main,footer{position:relative;z-index:1}
/* header */
header{position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pill{pointer-events:auto;width:min(960px,100%);margin-inline:auto;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:999px;animation:drop .9s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.97)}}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--head);text-decoration:none;margin-right:6px}
.brand img{width:30px;height:30px;border-radius:9px;transition:transform .6s var(--ease)}.brand:hover img{transform:rotate(-8deg) scale(1.08)}
nav{display:flex;gap:4px;margin-left:auto;font-size:15px}
.nb,nav a{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--body);text-decoration:none;color:var(--lw);background:#000;border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .35s var(--ease),color .35s,border-color .35s,transform .35s var(--ease)}
.nb:hover,nav a:hover{color:#fff;border-color:rgba(255,255,255,.45);transform:translateY(-1px)}
nav a[aria-current=page],.nb.on{background:#000;color:#fff;border-color:rgba(255,255,255,.86);box-shadow:0 0 18px rgba(255,255,255,.08)}
.ni{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lang{display:flex;gap:3px;padding:3px;border-radius:999px;background:#000;border:1px solid rgba(255,255,255,.1)}
.lang button{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--lw);background:#000;border:1px solid transparent;border-radius:999px;padding:6px 10px;cursor:pointer;transition:background .35s var(--ease),color .35s}
.lang button:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.lang button[aria-pressed=true]{background:#000;color:#fff;border-color:rgba(255,255,255,.75)}
.fl{width:20px;height:14px;border-radius:4px;flex:none;display:block}
/* ui */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:999px;font:600 15px var(--body);text-decoration:none;color:var(--lw);background:#000;border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:background .35s var(--ease),color .35s,border-color .35s,box-shadow .4s,transform .4s var(--ease);will-change:transform}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{color:#fff;border-color:rgba(255,255,255,.6);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.main{background:#000;color:#fff;border-color:rgba(255,255,255,.86);box-shadow:0 0 22px rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.05)}
.btn.main:hover{border-color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.07),0 10px 44px rgba(255,255,255,.2)}
.btn.sm{padding:9px 16px;font-size:14px}.btn.wide{width:100%;padding:15px}
.btn.ld{pointer-events:none}.btn.ld span{opacity:0}.btn.ld::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}

 const base=h*(HOME?.3:.36),amp=h*(HOME?.1:.07),th=h*(HOME?.36:.3),n=Math.min(G.length,Math.floor(w*(HOME?2.4:1.5)));

 const st=now=>{const k=Math.min(1,(now-t0)/1400),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v+s;if(k<1&&!RM)requestAnimationFrame(st)};requestAnimationFrame(st)}),{threshold:.6});
function reveal(){document.querySelectorAll(".card,.player,.mig,.svcs,details,.fg>div,.note").forEach(el=>el.classList.add("rv"));
 const all=[...document.querySelectorAll(".rv")];
 all.forEach(el=>{const sib=[...el.parentElement.children].filter(x=>x.classList.contains("rv"));el.style.setProperty("--rd",Math.min(sib.indexOf(el),6)*.09+"s")});
 io.disconnect();[...all,...document.querySelectorAll(".hl")].forEach(el=>io.observe(el));
 document.querySelectorAll("[data-n]").forEach(el=>ion.observe(el))}

 if(!b)return;const r=b.getBoundingClientRect();b.classList.add("mg");b.style.translate=`${(e.clientX-r.left-r.width/2)*.12}px ${(e.clientY-r.top-r.height/2)*.25}px`});

/* ---------- плавное раскрытие FAQ ---------- */
document.addEventListener("click",e=>{const s=e.target.closest("details>summary");if(!s)return;e.preventDefault();const d=s.parentElement;
 if(d._an){d._an.cancel();d._an=null}
 const cs=getComputedStyle(d),closedH=s.offsetHeight+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+parseFloat(cs.borderBottomWidth),h0=d.offsetHeight,opening=!d.open;
 d.style.overflow="hidden";if(opening){d.open=true;d.classList.remove("cl")}else d.classList.add("cl");
 const h1=d.offsetHeight;
 d._an=d.animate({height:opening?[closedH+"px",h1+"px"]:[h0+"px",closedH+"px"]},{duration:560,easing:"cubic-bezier(.2,.8,.2,1)"});
 d._an.onfinish=()=>{d._an=null;d.style.overflow="";if(!opening)d.open=false;d.classList.remove("cl")}});

/* ---------- цепочка букв при смене языка ---------- */
let LBUSY=false;
function wrapVisible(cls){const out=[];
 [$("header"),app,$("footer")].forEach(r=>{const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=w.nextNode())nodes.push(n);
  nodes.forEach(n=>{const p=n.parentElement;if(!n.nodeValue.trim()||!p||p.closest("canvas,script,style,.lyrics,#toast"))return;
   const r=p.getBoundingClientRect();if(!r.width||r.bottom<0||r.top>innerHeight)return;
   const h=document.createElement("span");h.className="kt";
   n.nodeValue.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){h.append(tok);return}
    const wd=document.createElement("span");wd.className="kw";[...tok].forEach(ch=>{const c=document.createElement("span");c.className="k "+cls;c.textContent=ch;wd.append(c);out.push(c)});h.append(wd)});
   n.replaceWith(h)})});
 out.forEach((c,i)=>c.style.animationDelay=Math.round(i/out.length*520)+"ms");return out}
function switchLang(l){if(l===L||LBUSY)return;
 const go=()=>{L=l;try{localStorage.setItem("lx-lang",L)}catch(e){}applyStatic();route(true)};
 if(RM){go();return}
 LBUSY=true;wrapVisible("o");
 setTimeout(()=>{document.body.classList.add("nt");go();
  document.querySelectorAll(".kt").forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));
  wrapVisible("i");
  setTimeout(()=>{document.querySelectorAll(".kt").forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));document.body.classList.remove("nt");LBUSY=false},1250)},960)}
