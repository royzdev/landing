<style>
:root{--bg:#000;--ink:#f3f2f7;--mut:#8d8b99;--line:#1d1c24;--card:#0d0d11;--acc:#b794ff;--pink:#ff7ad9;--ok:#4ade80;
--head:"Unbounded","Onest",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font:400 16px/1.6 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
#gfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
/* header pill */
header{position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pill{pointer-events:auto;width:min(780px,100%);margin-inline:auto;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.1);border-radius:999px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--head);text-decoration:none;margin-right:6px}
.brand img{width:30px;height:30px;border-radius:9px}
nav{display:flex;gap:2px;margin-left:auto;font-size:15px}
nav a{display:inline-flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;padding:9px 14px;border-radius:999px;transition:background .25s,color .25s}
nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
nav a[aria-current=page]{color:var(--ink);background:rgba(255,255,255,.09)}
.ni{width:18px;height:18px;flex:none}
.lang{display:flex;gap:2px;padding:3px;margin-left:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.lang button{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--mut);background:transparent;border:0;border-radius:999px;padding:7px 11px;cursor:pointer;transition:background .25s,color .25s}
.lang button[aria-pressed=true]{background:rgba(183,148,255,.18);color:var(--ink);box-shadow:0 0 18px rgba(183,148,255,.25)}
.fl{width:20px;height:14px;border-radius:4px;flex:none;display:block}
/* ui */
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;font:600 15px var(--body);text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;transition:border-color .25s,box-shadow .25s,background .25s}
.btn svg{width:18px;height:18px}
.btn.main{background:var(--ink);color:#000;border-color:var(--ink)}
.btn:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(183,148,255,.3)}
.btn.main:hover{background:#fff}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,64px)}
h2{font-size:clamp(26px,3.6vw,38px)}
h3{font-size:18px;font-weight:500}
p.lead{color:var(--mut);font-size:18px;max-width:56ch}
section{padding:84px 0}
.hl::after{content:"";display:block;height:3px;width:0;margin-top:16px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--pink));box-shadow:0 0 18px var(--acc);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.hl.in::after{width:76px}
.hero{padding:84px 0 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero small{display:block;margin-top:16px;color:var(--mut);font-size:14px}
.player{border:1px solid rgba(183,148,255,.22);border-radius:28px;background:rgba(13,13,17,.82);backdrop-filter:blur(10px);padding:26px;min-height:340px;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(155,120,255,.14)}
.player .meta{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.disc{width:68px;height:68px;overflow:hidden;border-radius:50%;flex:none;background:repeating-radial-gradient(circle,#15141b 0 1px,#0b0b0f 1px 4px);border:1px solid var(--line);position:relative;animation:spin 8s linear infinite;box-shadow:0 0 0 1px rgba(183,148,255,.35),0 0 26px rgba(183,148,255,.35)}
.disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.disc:after{content:"";position:absolute;inset:45%;border-radius:50%;background:#000;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.meta b{display:block;font-weight:600}.meta span{color:var(--mut);font-size:14px}
.lyrics{font:700 clamp(22px,3vw,30px)/1.3 var(--head);display:grid;gap:10px}
.line{color:#3a3944}
.w{position:relative;display:inline-block;white-space:nowrap;color:#3a3944}
.w::before{content:attr(data-t);position:absolute;left:0;top:0;color:var(--ink);text-shadow:0 0 20px rgba(183,148,255,.85);clip-path:inset(0 100% 0 0)}
.w::after{content:"";position:absolute;top:6%;bottom:6%;left:0;width:3px;border-radius:3px;background:linear-gradient(#fff,var(--acc));box-shadow:0 0 14px var(--acc),0 0 32px #9b8cff;opacity:0}
.line.done .w::before{clip-path:inset(0);text-shadow:none}
.line.on .w::before{animation:wipe var(--d,.9s) cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--t,0s)}
.line.on .w::after{animation:bar var(--d,.9s) cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--t,0s)}
@keyframes wipe{to{clip-path:inset(0)}}
@keyframes bar{0%{left:0;opacity:1}85%{opacity:1}100%{left:calc(100% - 3px);opacity:0}}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:26px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--pink))}
#viz{display:block;width:100%;height:56px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:40px}
.card{border:1px solid var(--line);border-radius:22px;padding:28px;background:rgba(13,13,17,.86);transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:rgba(183,148,255,.35);box-shadow:0 0 40px rgba(155,120,255,.12)}
.card p{color:var(--mut);margin-top:8px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(183,148,255,.1);border:1px solid rgba(183,148,255,.25);color:var(--acc);margin-bottom:18px;box-shadow:0 0 22px rgba(183,148,255,.15)}
.ic svg,.ni,.fi svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg{width:22px;height:22px}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-weight:500;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--mut)}details[open] summary::after{content:"−"}
details p{color:var(--mut);margin-top:10px;max-width:64ch}
footer{border-top:1px solid var(--line);padding:48px 0 calc(40px + env(safe-area-inset-bottom));margin-top:60px;color:var(--mut);font-size:14px;background:rgba(0,0,0,.6)}
.fg{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:28px}
.fg h4{color:var(--ink);font-weight:600;margin-bottom:10px;font-size:14px}.fg a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:3px 0}.fg a:hover{color:var(--ink)}
.fi svg{width:16px;height:16px}
.page{padding:84px 0 0}.page h1{font-size:clamp(30px,5vw,48px);margin-bottom:12px}
.mig{margin-top:36px;border:1px solid var(--line);border-radius:22px;background:rgba(13,13,17,.86);overflow:hidden;font-size:14px}
.mig-top{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);align-items:center;padding:14px;border-bottom:1px solid var(--line);background:#08080a}
.ep{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-width:0}
.ep div{min-width:0}.ep span{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.ep b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.flow{height:2px;margin:0 12px;background:repeating-linear-gradient(90deg,#3a3944 0 4px,transparent 4px 8px);position:relative}
.flow:after{content:"";position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:flow 1.8s cubic-bezier(.6,0,.4,1) infinite}
@keyframes flow{to{left:calc(100% - 8px)}}@keyframes flowv{to{top:calc(100% - 8px)}}
.pl{display:flex;align-items:center;gap:16px;padding:20px 20px 14px}
.mosaic{width:64px;height:64px;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;flex:none}
.pl div{min-width:0}.pl strong{display:block;font-weight:600;font-size:19px;line-height:1.3}.pl p{color:var(--mut)}
.pill2{margin-left:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mut);transition:color .3s,border-color .3s}
.mig.fin .pill2{color:var(--ok);border-color:rgba(74,222,128,.35)}
.tr{display:grid;grid-template-columns:22px 40px minmax(0,1fr) 150px 44px;gap:14px;align-items:center;padding:8px 20px}
.tr.th{color:var(--mut);font-size:13px;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:6px}.tr.th span:nth-child(2){grid-column:span 2}
.tr .n,.tr time{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
.cv{width:40px;height:40px;border-radius:5px;object-fit:cover;background:var(--line)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.tr b,.tr .a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr b{font-weight:500;font-size:15px}.tr .a{color:var(--mut);font-size:13px}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--mut)}
.st.ok{color:var(--ok)}.st.q{color:#55535f}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid #3a3944;border-top-color:var(--ink);animation:spin .8s linear infinite}
.mf{display:flex;align-items:center;gap:18px 24px;flex-wrap:wrap;padding:16px 20px;margin-top:8px;border-top:1px solid var(--line);background:#08080a}
.meter{flex:1 1 240px}.meter p{display:flex;gap:18px;color:var(--mut);font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.meter p i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--ok)}
.seg{height:6px;border-radius:6px;background:var(--line);display:flex;overflow:hidden}.seg i{height:100%;transition:width .5s ease}
.btn.sm{padding:9px 16px;font-size:14px}
.mig .save{opacity:.35;transition:opacity .3s}.mig.fin .save{opacity:1}
.svcs{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;margin-top:22px;color:var(--mut);font-size:14px}
.svcs .badge{display:inline-flex;align-items:center;gap:9px;color:var(--ink);padding:7px 16px 7px 12px;border-radius:999px;border:1px solid rgba(var(--bc),.35);background:none;box-shadow:none;transition:border-color .3s}.svcs .badge:hover{border-color:rgba(var(--bc),.8)}.svcs .logo{width:24px;height:24px;border-radius:0}
.note{color:var(--mut);font-size:14px;max-width:64ch;margin:18px 0}
.rel{border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:16px;background:rgba(13,13,17,.86)}
.rel h3{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.rel time{color:var(--mut);font:400 14px var(--body)}
.rel ul{margin:14px 0 0 20px;color:var(--mut)}.rel li{margin:4px 0}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:34px 0}
.legal h2{font-size:22px;margin:30px 0 8px}.legal p{color:var(--mut);max-width:70ch}
@media(max-width:820px){.mig-top{grid-template-columns:1fr;gap:0}.flow{width:2px;height:22px;margin:0 0 0 27px;background:repeating-linear-gradient(180deg,#3a3944 0 4px,transparent 4px 8px)}.flow:after{left:-3px;top:0;animation-name:flowv}
.tr{grid-template-columns:40px minmax(0,1fr) auto;padding-inline:16px}.tr .n,.tr time,.tr.th{display:none}.pl{padding-inline:16px}.mf{padding-inline:16px}.hero,.fg{grid-template-columns:1fr}.grid,.dl{grid-template-columns:1fr}section{padding:56px 0}.hero{padding-top:56px}.page{padding-top:56px}}
@media(max-width:600px){.brand span,nav a span{display:none}nav a{padding:9px 11px}.pill{padding-left:10px}.lang button{padding:7px 9px;gap:6px}}
.rv{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none;transition-delay:var(--rd,0s)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1!important;transform:none!important}.hl::after{width:76px}.line .w::before{clip-path:inset(0)}}
.mig-top{position:relative;overflow:hidden}
.mig-top::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 140% at 50% 50%,rgba(183,148,255,.12),transparent 70%),radial-gradient(110% 110% at 50% 50%,transparent 55%,rgba(0,0,0,.75))}
.mig-top::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.08;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");animation:gr .7s steps(4) infinite}
@keyframes gr{0%{background-position:0 0}25%{background-position:-40px 30px}50%{background-position:30px -50px}75%{background-position:-20px -20px}100%{background-position:50px 40px}}
#mst{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.mig-top .ep{position:relative;z-index:3;background:rgba(13,13,17,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.flow{background:none!important}.flow:after{display:none!important}
.cv{position:relative;overflow:hidden;display:grid;place-items:center;flex:none;font:700 15px var(--head);color:rgba(255,255,255,.88);background:linear-gradient(135deg,hsl(var(--h) 70% 48%),hsl(calc(var(--h) + 45) 80% 22%))}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mosaic .cv{width:100%;height:100%;border-radius:0;font-size:12px}
.tr.hit{animation:hit 1.4s ease-out}
@keyframes hit{0%{background:rgba(183,148,255,.2);box-shadow:inset 3px 0 0 var(--acc)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.seg i{background:linear-gradient(90deg,#8f5bff,#ff7ad9)!important;box-shadow:0 0 14px rgba(183,148,255,.7)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.step{position:relative}.step .num{position:absolute;top:24px;right:26px;font:700 13px var(--head);color:var(--mut)}
.cta{text-align:center;border:1px solid rgba(183,148,255,.25);border-radius:32px;padding:56px 24px;background:radial-gradient(80% 140% at 50% 0,rgba(183,148,255,.16),transparent 70%),rgba(13,13,17,.8);box-shadow:0 0 70px rgba(155,120,255,.12)}
.cta .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.cta h2::after{margin-inline:auto}.cta p{margin:12px auto 0}
@media(max-width:820px){.flow{height:76px!important;margin:0!important;width:100%!important}.grid.three{grid-template-columns:1fr}}
</style>

<div class="card"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M12 11v5"/></svg></div><h3>${t("port")}</h3><p>${t("portT")}</p><p style="margin-top:18px"><a class="btn" target="_blank" rel="noopener" href="${CFG.dlZip}">${t("portB")}</a></p></div></div>
<p class="note">${t("smart")}</p></div>`;
const changelog=()=>`<div class="page"><h1 class="hl">${t("logH")}</h1><p class="lead" style="margin:6px 0 30px">${t("logL")}</p>${t("logs").map(l=>`<div class="rel"><h3>${l[0]}<time>${l[1]}</time></h3><ul>${l[2].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
const legal=k=>{const d=t(k);return `<div class="page legal"><h1 class="hl">${d[0]}</h1><p class="note">${t("tpl")}</p>${d[1].map(x=>`<h2>${x[0]}</h2><p>${x[1]}</p>`).join("")}</div>`};
const nf=()=>`<div class="page"><h1 class="hl">404</h1><p class="lead" style="margin-top:6px">${t("nfT")} <a href="#/">${t("nfB")}</a></p></div>`;

/* ---------- живые блоки ---------- */
let tm,tm2;
function lyrics(){const el=$("#ly");if(!el)return;
 el.innerHTML=t("LY").map(l=>`<div class="line">${l.map(w=>`<span class="w" data-t="${w}">${w}</span>`).join(" ")}</div>`).join("");
 const LY=t("LY"),Ls=[...el.children],pb=$("#pb");let i=0;
 const run=()=>{if(!$("#ly"))return;Ls.forEach((x,k)=>{x.className="line"+(k<i?" done":k==i?" on":"")});
  const ws=[...Ls[i].children];ws.forEach((w,k)=>{w.style.setProperty("--d","0.9s");w.style.setProperty("--t",k*.9+"s")});
  pb.style.transition="none";pb.style.width=(i/LY.length*100)+"%";requestAnimationFrame(()=>{pb.style.transition=`width ${ws.length*.9}s linear`;pb.style.width=((i+1)/LY.length*100)+"%"});
  tm=setTimeout(()=>{i=(i+1)%LY.length;if(!i)Ls.forEach(x=>x.className="line");run()},ws.length*900+500)};
 run()}
const stHtml=k=>({ok:`<span class="st ok"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${t("found")}</span>`,wait:`<span class="st"><i class="spin"></i>${t("wait")}</span>`,q:`<span class="st q">${t("q")}</span>`})[k];
const MS={k:0,fin:false,was:false,burst:-9};
function migrate(){const box=$("#mig");if(!box)return;
 box.querySelectorAll(".lx").forEach(i=>i.src=$(".brand img").src);
 const rows=[...box.querySelectorAll(".sc")],BASE=136,TOTAL=142;let k=0;
 const paint=()=>{if(!$("#mig"))return;
  rows.forEach((r,j)=>{r.innerHTML=stHtml(j<k?"ok":j==k?"wait":"q")});
  const fin=k>=rows.length,done=BASE+k;
  if(fin&&!MS.was)MS.burst=performance.now()/1000;MS.was=fin;MS.k=k;MS.fin=fin;
  rows.forEach(r=>r.parentElement.classList.remove("hit"));
  if(k>0&&k<=rows.length){const tr=rows[k-1].parentElement;void tr.offsetWidth;tr.classList.add("hit")}
  $("#mok").textContent=done;$("#mbo").style.width=done/TOTAL*100+"%";
  box.classList.toggle("fin",fin);$("#mpill").textContent=fin?t("done"):t("run")+Math.round(done/TOTAL*100)+"%";
  tm2=setTimeout(()=>{k=fin?0:k+1;paint()},fin?3500:1200)};
 paint()}

/* ---------- графика: фон + визуализатор ---------- */
const gfx=$("#gfx"),gx=gfx.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;gfx.width=W*DPR;gfx.height=H*DPR;gx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",size);size();
const PTS=Array.from({length:64},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,v:Math.random()*.012+.004,a:Math.random()*.5+.15,p:Math.random()*6}));
const BL=[[.18,.2,.6,"150,110,255",.17],[.88,.32,.5,"255,110,220",.09],[.55,.9,.65,"90,120,255",.11]];
function viz(t){const v=$("#viz");if(!v)return;const w=v.clientWidth*DPR,h=v.clientHeight*DPR;if(v.width!==w){v.width=w;v.height=h}
 const c=v.getContext("2d");c.clearRect(0,0,w,h);const N=46,bw=w/N,g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,"#9b8cff");g.addColorStop(1,"#ff7ad9");c.fillStyle=g;
 const hit=Math.pow(Math.max(0,Math.sin(t*3.2)),6)*.3;
 for(let i=0;i<N;i++){const a=Math.abs(Math.sin(t*2+i*.5)*.5+Math.sin(t*3.3+i*.21)*.4)*(1-i/N*.45)+hit*(1-i/N);const bh=Math.max(3*DPR,Math.min(1,a)*h);c.fillRect(i*bw+bw*.22,h-bh,bw*.56,bh)}}
const MP=Array.from({length:90},()=>({u:Math.random(),s:.14+Math.random()*.26,o:(Math.random()-.5)*2,r:Math.random()*1.6+.6}));
function mstream(t){
 const cv=$("#mst");if(!cv)return;const box=cv.parentElement,w=box.clientWidth,h=box.clientHeight;
 if(cv.width!==Math.round(w*DPR)||cv.height!==Math.round(h*DPR)){cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR)}
 const c=cv.getContext("2d");c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,w,h);
 const eps=box.querySelectorAll(".ep");if(eps.length<2)return;
 const b=box.getBoundingClientRect(),r1=eps[0].getBoundingClientRect(),r2=eps[1].getBoundingClientRect(),vert=innerWidth<=820;
 const A=vert?{x:r1.left-b.left+r1.width/2,y:r1.bottom-b.top}:{x:r1.right-b.left,y:r1.top-b.top+r1.height/2};
 const B=vert?{x:r2.left-b.left+r2.width/2,y:r2.top-b.top}:{x:r2.left-b.left,y:r2.top-b.top+r2.height/2};
 const C1=vert?{x:A.x,y:A.y+(B.y-A.y)*.4}:{x:A.x+(B.x-A.x)*.4,y:A.y},C2=vert?{x:B.x,y:B.y-(B.y-A.y)*.4}:{x:B.x-(B.x-A.x)*.4,y:B.y};
 const pt=u=>{u=Math.min(1,Math.max(0,u));const m=1-u;return{x:m*m*m*A.x+3*m*m*u*C1.x+3*m*u*u*C2.x+u*u*u*B.x,y:m*m*m*A.y+3*m*m*u*C1.y+3*m*u*u*C2.y+u*u*u*B.y}};
 const spread=vert?Math.min(70,w*.18):22,dt=Math.min(.05,t-(MS.lt||t));MS.lt=t;const sp=MS.fin?.3:1;
 const mix=(a,z,u)=>a.map((v,i)=>Math.round(v+(z[i]-v)*u)).join(","),c0=[255,188,13],c1=[200,165,255],c2=[255,130,220];
 c.globalCompositeOperation="lighter";
 [[A,c0,.16],[B,c1,.22+.08*Math.sin(t*6)]].forEach(([p,col,a])=>{const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,70);g.addColorStop(0,`rgba(${col.join(",")},${a})`);g.addColorStop(1,`rgba(${col.join(",")},0)`);c.fillStyle=g;c.fillRect(p.x-70,p.y-70,140,140)});
 MP.forEach(p=>{p.u=(p.u+p.s*dt*sp)%1;const q=pt(p.u),q2=pt(p.u-.035),dx=pt(p.u+.01).x-q.x,dy=pt(p.u+.01).y-q.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,amp=Math.sin(p.u*Math.PI)*spread*p.o*(.65+.35*Math.sin(t*1.4+p.o*5)),al=Math.sin(p.u*Math.PI)*.85;
  const col=p.u<.5?mix(c0,c1,p.u*2):mix(c1,c2,(p.u-.5)*2);
  c.strokeStyle=`rgba(${col},${al*.5})`;c.lineWidth=p.r;c.beginPath();c.moveTo(q2.x+nx*amp,q2.y+ny*amp);c.lineTo(q.x+nx*amp,q.y+ny*amp);c.stroke();
  c.fillStyle=`rgba(${col},${al})`;c.beginPath();c.arc(q.x+nx*amp,q.y+ny*amp,p.r,0,6.283);c.fill()});
 for(let i=0;i<5;i++){const u=((t*.14*sp+i/5)%1),q=pt(u),al=Math.sin(u*Math.PI),s=7+6*al;c.save();c.translate(q.x,q.y);c.rotate(Math.sin(t*1.2+i)*.35);
  const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,`rgba(255,188,13,${al*.9})`);g.addColorStop(1,`rgba(255,122,217,${al*.9})`);c.fillStyle=g;c.shadowColor="rgba(183,148,255,.9)";c.shadowBlur=14;c.fillRect(-s/2,-s/2,s,s);c.restore()}
 const age=t-MS.burst;
 if(age>=0&&age<1.8){const k=1-age/1.8;c.strokeStyle=`rgba(210,180,255,${k*.7})`;c.lineWidth=2+k*3;c.beginPath();c.arc(B.x,B.y,age*200,0,6.283);c.stroke();
  const f=Math.max(0,1-age/1.1),g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,"rgba(190,140,255,0)");g.addColorStop(.5,`rgba(255,235,255,${f})`);g.addColorStop(1,"rgba(190,140,255,0)");c.fillStyle=g;c.fillRect(0,B.y-1-f*2,w,2+f*4)}
 c.globalCompositeOperation="source-over"}
function frame(ms){
 const t=ms/1000,sy=scrollY;
 gx.clearRect(0,0,W,H);
 BL.forEach((b,i)=>{const x=(b[0]+Math.sin(t*.12+i*2)*.08)*W,y=(b[1]+Math.cos(t*.1+i)*.06)*H-sy*.06*(i+1),r=b[2]*Math.max(W,H),g=gx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${b[3]},${b[4]})`);g.addColorStop(1,`rgba(${b[3]},0)`);gx.fillStyle=g;gx.fillRect(0,0,W,H)});
 const hy=H*.8,vx=W/2,ph=(t*.12+sy*.002)%1;
 gx.lineWidth=1;gx.strokeStyle="rgba(183,148,255,.09)";
 for(let i=-12;i<=12;i++){gx.beginPath();gx.moveTo(vx+i*W*.012,hy);gx.lineTo(vx+i*W*.28,H);gx.stroke()}
 for(let k=0;k<10;k++){const z=Math.pow((k+ph)/10,2.2),y=hy+(H-hy)*z;gx.strokeStyle=`rgba(255,140,230,${.02+z*.1})`;gx.beginPath();gx.moveTo(0,y);gx.lineTo(W,y);gx.stroke()}
 PTS.forEach(p=>{p.y-=p.v/60;if(p.y<-.02)p.y=1.02;gx.fillStyle=`rgba(210,190,255,${(p.a*(.6+.4*Math.sin(t+p.p))).toFixed(3)})`;gx.beginPath();gx.arc((p.x+Math.sin(t*.3+p.p)*.02)*W,p.y*H,p.r,0,6.283);gx.fill()});
 viz(t);mstream(t);
 if(!RM)requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- появление блоков и заголовков ---------- */
const RV_BLOCK=".card,.player,.mig,.svcs,.rel,details,.fg>div";
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("in",e.isIntersecting)),{rootMargin:"-8% 0px -8% 0px"});
function reveal(){
 document.querySelectorAll(RV_BLOCK).forEach(el=>el.classList.add("rv"));
 const all=[...document.querySelectorAll(".rv")];
 all.forEach(el=>{const sib=[...el.parentElement.children].filter(x=>x.classList.contains("rv"));el.style.setProperty("--rd",Math.min(sib.indexOf(el),6)*.1+"s")});
 io.disconnect();[...all,...document.querySelectorAll(".hl")].forEach(el=>io.observe(el))}

/* ---------- язык и маршруты ---------- */
function applyStatic(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
 document.querySelector('meta[name="description"]').content=t("desc");
 $("#nav").setAttribute("aria-label",L=="ru"?"Основное":"Main")}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lx-lang",L)}catch(e){}applyStatic();route(true)});
const R={"/":home,"/download":download,"/changelog":changelog,"/privacy":()=>legal("priv"),"/terms":()=>legal("terms")};
function route(keep){clearTimeout(tm);clearTimeout(tm2);const p=(location.hash.slice(1)||"/").split("?")[0];
 document.querySelectorAll("#nav a").forEach(a=>{a.dataset.r===p?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
 app.innerHTML=(R[p]||nf)();document.title=p=="/"?t("title"):"Lirix";
 if(p=="/"){lyrics();migrate()}
 reveal();
 if(keep!==true&&!["/features","/migration","/faq"].includes(p))scrollTo(0,0)}
addEventListener("hashchange",()=>route());applyStatic();route();
</script>
</body>
