<style>
:root{--bg:#000;--ink:#f3f2f7;--mut:#8d8b99;--line:#1d1c24;--card:#0d0d11;--acc:#9b8cff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
--head:"Unbounded","Onest",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font:400 16px/1.6 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--head);text-decoration:none}
.brand img{width:30px;height:30px;border-radius:8px}
nav{display:flex;gap:22px;margin-left:auto;font-size:15px}
nav a{color:var(--mut);text-decoration:none;padding:6px 0}
nav a:hover,nav a[aria-current=page]{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font:600 15px var(--body);text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer}
.btn.main{background:var(--ink);color:#000;border-color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.main:hover{background:#fff}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,64px)}
h2{font-size:clamp(26px,3.6vw,38px)}
h3{font-size:18px;font-weight:500}
p.lead{color:var(--mut);font-size:18px;max-width:56ch}
section{padding:84px 0}
.hero{padding:72px 0 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero small{display:block;margin-top:16px;color:var(--mut);font-size:14px}
.player{border:1px solid var(--line);border-radius:28px;background:var(--card);padding:26px;min-height:340px;position:relative;overflow:hidden}
.player .meta{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.disc{width:54px;height:54px;border-radius:50%;flex:none;background:repeating-radial-gradient(circle,#15141b 0 1px,#0b0b0f 1px 4px);border:1px solid var(--line);position:relative;animation:spin 8s linear infinite}
.disc:after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.meta b{display:block;font-weight:600}.meta span{color:var(--mut);font-size:14px}
.lyrics{font:700 clamp(22px,3vw,30px)/1.3 var(--head);display:grid;gap:10px}
.line{color:#3a3944;transition:color .4s}
.line.on{color:var(--ink)}
.w{background:linear-gradient(90deg,var(--acc) 50%,#3a3944 50%) 100% 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.line.done .w{background-position:0 0}
.line.on .w{animation:fill var(--d,.5s) linear forwards;animation-delay:var(--t,0s)}
@keyframes fill{to{background-position:0 0}}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:26px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:40px}
.card{border:1px solid var(--line);border-radius:22px;padding:28px;background:var(--card)}
.card p{color:var(--mut);margin-top:8px}
.card.wide{grid-column:1/-1;display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px}
pre{font:13px/1.7 ui-monospace,Consolas,monospace;color:var(--mut);background:#050507;border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto;white-space:pre}
pre em{color:var(--ok);font-style:normal}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-weight:500;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--mut)}details[open] summary::after{content:"−"}
details p{color:var(--mut);margin-top:10px;max-width:64ch}
.cta{text-align:center;border:1px solid var(--line);border-radius:32px;padding:64px 24px;background:radial-gradient(60% 120% at 50% 0,#17132b,transparent 70%),var(--card)}
.cta p{color:var(--mut);margin:12px 0 28px}
footer{border-top:1px solid var(--line);padding:48px 0 calc(40px + env(safe-area-inset-bottom));margin-top:60px;color:var(--mut);font-size:14px}
.fg{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:28px}
.fg h4{color:var(--ink);font-weight:600;margin-bottom:10px;font-size:14px}.fg a{display:block;text-decoration:none;padding:3px 0}.fg a:hover{color:var(--ink)}
.page{padding:64px 0 0}.page h1{font-size:clamp(30px,5vw,48px);margin-bottom:12px}
.banner{margin:30px 0;border:1px solid var(--line);border-radius:20px;padding:20px 24px;display:flex;align-items:center;gap:14px;background:var(--card);font-weight:500}
.dot{width:11px;height:11px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(251,191,36,.15)}.dot.bad{background:var(--bad);box-shadow:0 0 0 4px rgba(248,113,113,.15)}
.svc{border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:12px;background:var(--card)}
.svc .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.svc .top b{font-weight:600}.svc .top span{color:var(--mut);font-size:14px}
.svc .top .r{margin-left:auto;text-align:right}
.days{display:flex;gap:2px;margin-top:14px;height:30px}.days i{flex:1;border-radius:2px;background:var(--ok);opacity:.85;min-width:1px}
.days i.warn{background:var(--warn)}.days i.bad{background:var(--bad)}
.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px}
.note{color:var(--mut);font-size:14px;border-left:2px solid var(--acc);padding:2px 0 2px 14px;margin:18px 0}
.inc{border-top:1px solid var(--line);padding:18px 0}.inc time{color:var(--mut);font-size:14px}.inc p{color:var(--mut)}
.rel{border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:16px;background:var(--card)}
.rel h3{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.rel time{color:var(--mut);font:400 14px var(--body)}
.rel ul{margin:14px 0 0 20px;color:var(--mut)}.rel li{margin:4px 0}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:34px 0}
.legal h2{font-size:22px;margin:30px 0 8px}.legal p{color:var(--mut);max-width:70ch}
@media(max-width:820px){.hero,.fg{grid-template-columns:1fr}.grid,.dl{grid-template-columns:1fr}nav{gap:14px;font-size:14px}.nav{gap:12px}.brand span{display:none}section{padding:56px 0}}
@media(max-width:560px){nav a.hide{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line .w{background-position:0 0}}
</style>

<p class="note">Если Windows показывает предупреждение SmartScreen, нажмите «Подробнее» → «Выполнить в любом случае».</p></div>`;

const logs=[["1.3.0","2026-10-15",["Подключённые сервисы теперь у каждого пользователя свои","Мини-плеер скрывается при открытом главном окне и возвращается при сворачивании","Исправлена прозрачность мини-плеера"]],
["1.2.0","2026-10-01",["Мастерская: публикация, поиск и скачивание работ","Пластинка: обложка на весь диск, кнопки лайка и плейлиста у края"]],
["1.1.0","2026-09-12",["Импорт плейлистов из Яндекс Музыки и Deezer","Ускорена загрузка библиотеки"]]];
const changelog=()=>`<div class="page"><h1>Обновления</h1><p class="lead" style="margin-bottom:30px">Что менялось в каждой версии.</p>${logs.map(l=>`<div class="rel"><h3>${l[0]}<time>${l[1]}</time></h3><ul>${l[2].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;

const legal=(t,s)=>`<div class="page legal"><h1>${t}</h1><p class="note">Шаблон: замените текст на актуальный перед публикацией.</p>${s.map(x=>`<h2>${x[0]}</h2><p>${x[1]}</p>`).join("")}</div>`;
const privacy=()=>legal("Политика конфиденциальности",[["Какие данные мы храним","Токены подключённых сервисов и ваша библиотека хранятся локально на вашем компьютере."],["Что уходит на серверы","Запросы каталога и текстов. Личные данные, имена и e-mail не собираются."],["Связь","Вопросы о данных — через контакты в разделе «Сообщество»."]]);
const terms=()=>legal("Условия использования",[["Использование","Lirix предоставляется «как есть». Вы отвечаете за соблюдение правил подключаемых сервисов."],["Контент","Мы не размещаем музыку на своих серверах: приложение получает доступ к вашим подключённым аккаунтам."],["Изменения","Условия могут обновляться; актуальная версия всегда на этой странице."]]);
const nf=()=>`<div class="page"><h1>404</h1><p class="lead">Такой страницы нет. <a href="#/">Вернуться на главную</a></p></div>`;

/* ----- Статус ----- */
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647);
function demo(){const r=rnd(7),mk=(w)=>Array.from({length:90},()=>{const x=r();return x<w?"bad":x<w*3?"warn":"ok"});
 return{demo:true,services:[
 {name:"API и каталог",desc:"Поиск, главная, библиотека",status:"ok",latency:84,uptime:99.97,days:mk(.002)},
 {name:"Тексты песен",desc:"Синхронизация по слогам",status:"ok",latency:132,uptime:99.91,days:mk(.004)},
 {name:"Аудио-прокси",desc:"Потоки и обложки",status:"warn",latency:240,uptime:99.62,days:mk(.01)},
 {name:"Мастерская",desc:"Публикация и загрузка работ",status:"ok",latency:97,uptime:99.88,days:mk(.005)},
 {name:"Авторизация",desc:"Вход и подключённые сервисы",status:"ok",latency:61,uptime:99.99,days:mk(.001)}],
 incidents:[{date:"2026-10-12",title:"Повышенные задержки аудио-прокси",text:"Часть потоков загружалась дольше обычного. Нагрузка выровнена."}]}}
const lab={ok:"Работает",warn:"Замедление",bad:"Сбой"};
async function status(){
 app.innerHTML=`<div class="page"><h1>Статус серверов</h1><p class="lead">Состояние сервисов Lirix за последние 90 дней.</p><div id="st" style="margin-top:26px">Загрузка…</div></div>`;
 let d;try{d=CFG.statusUrl?await (await fetch(CFG.statusUrl,{cache:"no-store"})).json():demo()}catch(e){d=null}
 const box=$("#st");if(!box)return;
 if(!d){box.innerHTML=`<div class="banner"><span class="dot bad"></span>Не удалось получить статус. Проверьте адрес status.json и обновите страницу.</div>`;return}
 const worst=d.services.some(s=>s.status=="bad")?"bad":d.services.some(s=>s.status=="warn")?"warn":"ok";
 const head={ok:"Все системы работают",warn:"Часть сервисов работает медленнее",bad:"Есть сбои в работе сервисов"}[worst];
 box.innerHTML=`<div class="banner"><span class="dot ${worst=="ok"?"":worst}"></span>${head}</div>`+
 (d.demo?`<p class="note">Показаны демо-данные. Укажите <code>statusUrl</code> в настройках файла, чтобы видеть реальное состояние.</p>`:"")+
 d.services.map(s=>`<div class="svc"><div class="top"><span class="dot ${s.status=="ok"?"":s.status}"></span><b>${s.name}</b><span>${s.desc||""}</span><div class="r"><b>${lab[s.status]||""}</b><br><span>${s.latency} мс · ${s.uptime}% за 90 дней</span></div></div>
 <div class="days" role="img" aria-label="История за 90 дней">${(s.days||[]).map(x=>`<i class="${x=="ok"?"":x}"></i>`).join("")}</div><div class="scale"><span>90 дней назад</span><span>Сегодня</span></div></div>`).join("")+
 `<h2 style="margin:40px 0 6px;font-size:24px">Инциденты</h2>`+((d.incidents||[]).length?d.incidents.map(i=>`<div class="inc"><time>${i.date}</time><h3>${i.title}</h3><p>${i.text}</p></div>`).join(""):`<p class="lead">За последние 90 дней сбоев не было.</p>`);
}

/* ----- Демо-плеер строк ----- */
let tm;
function lyrics(){const el=$("#ly");if(!el)return;
 el.innerHTML=LY.map(l=>`<div class="line">${l.map(w=>`<span class="w">${w}</span>`).join(" ")}</div>`).join("");
 const L=[...el.children],pb=$("#pb");let i=0;
 const run=()=>{if(!$("#ly"))return;L.forEach((x,k)=>{x.className="line"+(k<i?" done":k==i?" on":"")});
  const ws=[...L[i].children];ws.forEach((w,k)=>{w.style.setProperty("--d","0.9s");w.style.setProperty("--t",k*.9+"s")});
  pb.style.transition="none";pb.style.width=(i/LY.length*100)+"%";requestAnimationFrame(()=>{pb.style.transition=`width ${ws.length*.9}s linear`;pb.style.width=((i+1)/LY.length*100)+"%"});
  tm=setTimeout(()=>{i=(i+1)%LY.length;if(!i)L.forEach(x=>x.className="line");run()},ws.length*900+500)};
 run()}

/* ----- Роутер ----- */
const R={"/":home,"/download":download,"/changelog":changelog,"/privacy":privacy,"/terms":terms};
function route(){clearTimeout(tm);const p=(location.hash.slice(1)||"/").split("?")[0];
 document.querySelectorAll("nav a").forEach(a=>{a.dataset.r===p?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
 if(p=="/status"){status();window.scrollTo(0,0);document.title="Статус серверов — Lirix";return}
 app.innerHTML=(R[p]||nf)();document.title=(p=="/"?"Lirix — музыка со словами в такт":"Lirix");
 if(p=="/")lyrics();
 const a=location.hash.slice(1);if(["/features","/migration","/faq"].includes(a)){} else window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
setInterval(()=>{if((location.hash.slice(1)||"/")=="/status")status()},60000);
</script>
</body>
</html>
